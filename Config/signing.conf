#!/bin/bash
# SpeechCast: cryptographically pinned public certificate of the release signing identity.
# Format: NAME=VALUE, no quoting, one setting per line, uppercase names only.
# This is the authoritative source for the certificate digest and bundle identifier.
# Every consumer cross-checks against these values. Swift embeds the digest because the
# standalone test harness and curl installer cannot depend on an app resource.
#
# The certificate itself is committed alongside: SpeechCastSigning.pem (the public
# certificate, safe to publish). The private key never enters the repository.
#
# Changing SPEECHCAST_CERTIFICATE_SHA256 rotates the release identity: every old
# client stops accepting new releases until it runs the installer once. Never edit
# this by hand for a normal release — the value only changes on key rotation.
SPEECHCAST_CERTIFICATE_SHA256=A0AA9BCD7AFBC13A3CF4B16CAC7B84A0632816143F9C9D217DF9757B8400FD62
SPEECHCAST_BUNDLE_ID=com.tinycast.app
