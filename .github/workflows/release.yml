name: Release

# Shown in the Actions list instead of a bare "Release" — carries the version.
run-name: "SpeechCast ${{ inputs.version || github.ref_name }} #${{ github.run_number }}"

# Cut a release either manually from the Actions tab (a version input) or by
# pushing a v* tag: the tag name is the version. Both paths run the same jobs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.12.0 or 0.12.0-beta.1"
        type: string
        required: true
  push:
    tags:
      - "v*"


permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      full_version: ${{ steps.meta.outputs.full_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # check-migrations.sh compares against release tags; a shallow clone would pass everything.
          fetch-depth: 0

      - name: Check shipped migrations
        run: ./Scripts/check-migrations.sh

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            find /Applications -maxdepth 1 -iname '*xcode*' || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      # Validate the input into an environment variable and use ONLY that below:
      # the version flows into shell commands, so it must be a checked literal,
      # never an interpolated expression.
      - name: Validate version and compute release metadata
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          FULL="${INPUT_VERSION#v}"
          if ! [[ "$FULL" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-beta[.N], got '$FULL'"
            exit 1
          fi
          {
            echo "full_version=${FULL}"
            echo "dmg_file=SpeechCast-${FULL}.dmg"
            echo "zip_file=SpeechCast-${FULL}.zip"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=${FULL}" >> "$GITHUB_ENV"

      # The pin must be consistent everywhere before anything is signed: the
      # committed certificate, Config/signing.conf, the installer literal, and
      # the updater's Swift literal all have to agree.
      - name: Assert signing pin consistency
        run: ./Scripts/check-signing-config.sh

      # Fail before any build work so a secret typo is a 30s failure, not a 2h
      # one. Nothing here prints a value; only the names of missing secrets.
      - name: Preflight required secrets
        env:
          P12_BASE64: ${{ secrets.SPEECHCAST_SIGNING_P12_BASE64 || secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SPEECHCAST_SIGNING_P12_PASSWORD || secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=()
          [ -n "$P12_BASE64" ] || MISSING+=("SPEECHCAST_SIGNING_P12_BASE64 or SIGNING_P12_BASE64")
          [ -n "$P12_PASSWORD" ] || MISSING+=("SPEECHCAST_SIGNING_P12_PASSWORD or SIGNING_P12_PASSWORD")
          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi

      # Imports the pinned certificate into an ephemeral keychain and proves —
      # cryptographically, before any signing — that its SHA256 matches the pin
      # in Config/signing.conf (and therefore the installer and the updater).
      - name: Import release signing certificate
        env:
          P12_BASE64: ${{ secrets.SPEECHCAST_SIGNING_P12_BASE64 || secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SPEECHCAST_SIGNING_P12_PASSWORD || secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          printf '%s' "$P12_BASE64" \
            | SPEECHCAST_SIGNING_P12_PASSWORD="$P12_PASSWORD" \
                ./Scripts/import-signing-certificate.sh - - "$KEYCHAIN"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # Build the .app UNSIGNED into an ephemeral DerivedData dir, then sign it
      # explicitly with Scripts/sign-release-app.sh. Xcode resolves signing
      # identities through the keychain search list, which must never be
      # modified on the runner; direct codesign against an explicit keychain
      # works and keeps the machine untouched. PRODUCT_NAME is deliberately not
      # overridden: a global override renames the embedded helper products too.
      - name: Build app (unsigned)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            TINYCAST_BUNDLE_IDENTIFIER=com.tinycast.app \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/SpeechCast.app"
          [ -d "$APP" ] || {
            echo "::error::expected built app at $APP (product name comes from the project)"
            exit 1
          }

      # Nested helpers first, the app bundle last with its entitlements, all
      # with the pinned certificate: runtime flag, no timestamp (no authority
      # exists for one on a self-signed identity).
      - name: Sign the app with the pinned release certificate
        run: |
          set -euo pipefail
          ./Scripts/sign-release-app.sh \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release/SpeechCast.app" \
            "$SIGNING_KEYCHAIN"

      # Apple silicon users pay for no Intel slice: assert the download stays
      # thin. Helpers are shipped code too, and nothing else would catch a stray
      # slice in them.
      - name: Assert the build is arm64-only
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/SpeechCast.app"
          MACHOS="$(while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q "Mach-O"; then
                  echo "$f"
              fi
          done < <(find "$APP/Contents" -type f -print0); true)"
          BINS="$MACHOS"
          while IFS= read -r BIN; do
              [ -n "$BIN" ] || continue
              SLICES="$(lipo -archs "$BIN")"
              if [ "$SLICES" != "arm64" ]; then
                  echo "::error::${BIN#"$APP"/}: expected arm64 alone, got '$SLICES'"
                  exit 1
              fi
          done <<< "$BINS"

      # Assert the hardened-runtime flag reached every Mach-O rather than
      # trusting Xcode, and that the usage strings the permission prompts need
      # are entitled.
      - name: Assert the signature is release-safe
        run: ./Scripts/verify-signature.sh \
          "$RUNNER_TEMP/DerivedData/Build/Products/Release/SpeechCast.app"

      # Full gate on the built app: pinned certificate on the bundle and every
      # nested Mach-O, hardened runtime, bundle id and version.
      - name: Verify the built app against the pin
        run: ./Scripts/verify-release.sh app \
          "$RUNNER_TEMP/DerivedData/Build/Products/Release/SpeechCast.app" \
          --version "$VERSION"

      # Package the signed DMG (signed with the same pinned certificate) plus
      # the ditto zip and SHA256SUMS. Everything after this point ships.
      - name: Package and sign release DMG, ZIP, checksums
        run: |
          set -euo pipefail
          ./Scripts/package-release.sh \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release/SpeechCast.app" \
            "$VERSION" dist "$SIGNING_KEYCHAIN"

      # Full gate on the shipping bytes: pinned certificate on the image and the
      # app inside it (nested code included), versions, and the zip contents.
      - name: Verify final DMG and ZIP
        run: |
          set -euo pipefail
          ./Scripts/verify-release.sh dmg "dist/SpeechCast-${VERSION}.dmg" --version "$VERSION"
          EXTRACT_DIR="$RUNNER_TEMP/zip-extract"
          mkdir -p "$EXTRACT_DIR"
          ditto -x -k --sequesterRsrc "dist/SpeechCast-${VERSION}.zip" "$EXTRACT_DIR"
          ./Scripts/verify-release.sh app "$EXTRACT_DIR/SpeechCast.app" --version "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: SpeechCast-${{ steps.meta.outputs.full_version }}
          path: dist

      # The signing keychain never outlives the job, even when signing failed.
      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          fi

  verify-install:
    runs-on: macos-26
    needs: build
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: SpeechCast-${{ needs.build.outputs.full_version }}
          path: dist

      # Clean-machine exercise of the real installer against the real release
      # artifact: quarantine, clean install, reinstall over the same version,
      # migration from old names, corrupted and unknown-certificate rejection,
      # rollback on failure, settings preservation, and a real launch of the
      # installed app (CI only). Owns its own fixtures; no secrets here.
      - name: Exercise the installer end to end
        env:
          VERSION: ${{ needs.build.outputs.full_version }}
        run: ./Scripts/test-release-installation.sh "dist/SpeechCast-${VERSION}.dmg" "$VERSION" --launch

  verify-upgrade:
    runs-on: macos-26
    needs: [build, verify-install]
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: SpeechCast-${{ needs.build.outputs.full_version }}
          path: dist

      # The fork shipped self-signed Tinycast copies before the switch. Install
      # the previous published release first, then the new DMG over it through
      # Scripts/install.sh, and prove the settings survive and the bundle id
      # never changes. The old release's own certificate does not have to match
      # the new pin: replacement trusts only the NEW download's signature,
      # never the old copy's.
      - name: Upgrade a previous release in place
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.full_version }}
        run: |
          set -euo pipefail
          DMG="dist/SpeechCast-${VERSION}.dmg"
          [ -f "$DMG" ] || { echo "::error::$DMG missing from artifact"; exit 1; }

          LEGACY_DIR="$RUNNER_TEMP/legacy"
          mkdir -p "$LEGACY_DIR"
          # Newest published release that is not the one being cut, so a re-run
          # still exercises an upgrade instead of skipping the check.
          TAGS="$(gh release list --repo "$REPO" --limit 50 \
              --json tagName,isDraft,isPrerelease \
              --jq '.[] | select(.isDraft | not) | .tagName')"
          PREV_TAG="$(printf '%s\n' "$TAGS" | grep -vx "v${VERSION}" | sed -n '1p' || true)"
          if [ -z "$PREV_TAG" ]; then
            echo "::warning::No earlier published release to upgrade from; skipping the in-place check"
            exit 0
          fi
          PREV_ASSET="$(gh release view "$PREV_TAG" --repo "$REPO" --json assets \
              --jq '[.assets[].name | select(test("\\.dmg$"))] | first // empty')"
          [ -n "$PREV_ASSET" ] || { echo "::error::$PREV_TAG has no DMG to upgrade from"; exit 1; }
          gh release download "$PREV_TAG" --repo "$REPO" --pattern "$PREV_ASSET" --dir "$LEGACY_DIR"

          MOUNT="$RUNNER_TEMP/legacy-mount"
          mkdir -p "$MOUNT"
          hdiutil attach -readonly -nobrowse -quiet -mountpoint "$MOUNT" \
              "$LEGACY_DIR/$PREV_ASSET"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT
          PREV_APP="$(find "$MOUNT" -maxdepth 1 -name '*.app' -type d -print -quit)"
          [ -n "$PREV_APP" ] || { echo "::error::$PREV_ASSET contains no app"; exit 1; }
          # Keep the shipped name: a pre-rename release ships Tinycast.app or
          # VoiceCast.app, and the installer has to take both over.
          ditto "$PREV_APP" "$LEGACY_DIR/$(basename "$PREV_APP")"
          hdiutil detach "$MOUNT" -quiet

          # A user's settings live in ~/.config/tinycast/settings.json (AppPaths),
          # keyed by the stable bundle id, and the prefs domain is the same; the
          # update must not touch either.
          SETTINGS_DIR="$HOME/.config/tinycast"
          mkdir -p "$SETTINGS_DIR"
          printf '{"settingsFile":{"version":1},"hotkey":{"value":"option-space"}}\n' \
              > "$SETTINGS_DIR/settings.json"
          BEFORE="$(shasum -a 256 "$SETTINGS_DIR/settings.json")"

          PREV_INFO="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
              "$LEGACY_DIR/$(basename "$PREV_APP")/Contents/Info.plist")"
          [ "$PREV_INFO" = "com.tinycast.app" ] \
              || { echo "::error::$PREV_TAG has bundle id '$PREV_INFO', not com.tinycast.app"; exit 1; }

          SPEECHCAST_INSTALL_DIR="$LEGACY_DIR" SPEECHCAST_DMG="$DMG" \
              ./Scripts/install.sh

          AFTER="$(shasum -a 256 "$SETTINGS_DIR/settings.json")"
          [ "$BEFORE" = "$AFTER" ] \
              || { echo "::error::upgrade modified the user's settings file"; exit 1; }
          [ ! -e "$LEGACY_DIR/Tinycast.app" ] && [ ! -e "$LEGACY_DIR/VoiceCast.app" ] \
              || { echo "::error::legacy app was left behind"; exit 1; }
          ./Scripts/verify-release.sh app "$LEGACY_DIR/SpeechCast.app" --version "$VERSION"
          echo "✓ $PREV_TAG upgraded in place to $VERSION with settings intact"

  # The release is created as a DRAFT with the final assets, then a clean job
  # downloads the draft's actual uploaded bytes through the GitHub API and runs
  # the full verification suite against them. Only if that passes does the final
  # job publish the draft. A failed verification deletes the draft.
  verify-draft:
    outputs:
      draft_created: ${{ steps.draft.outputs.created }}
    runs-on: macos-26
    needs: [build, verify-install, verify-upgrade]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: SpeechCast-${{ needs.build.outputs.full_version }}
          path: dist

      - name: Create draft release with the final assets
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.full_version }}
        run: |
          set -euo pipefail
          # The changelog GitHub derives from the merged PRs, with the install
          # text below a marker the update window cuts at. Nothing is committed
          # anywhere — see docs/release.md.
          TAG="v${VERSION}" ./Scripts/release-notes.sh "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/discord.md"
          gh release create "v${VERSION}" \
              "dist/SpeechCast-${VERSION}.dmg" \
              "dist/SpeechCast-${VERSION}.zip" \
              "dist/SpeechCast-${VERSION}.sha256sums" \
              --repo "$REPO" \
              --target "$SHA" \
              --draft \
              --title "SpeechCast ${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Download the draft's own uploaded bytes (not the build artifacts) in a
      # clean job and verify them exactly as an installer would: this catches a
      # corrupted upload, a wrong asset, or a broken release page before it is
      # visible to users. Draft assets are only fetchable with repository write
      # credentials; the bytes are the immutable, published ones.
      - name: Verify the uploaded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.full_version }}
        run: |
          set -euo pipefail
          DRAFT_DIR="$RUNNER_TEMP/draft-download"
          mkdir -p "$DRAFT_DIR"
          gh release download "v${VERSION}" --repo "$REPO" \
              --pattern "SpeechCast-${VERSION}.*" --dir "$DRAFT_DIR"
          # The uploaded sums file must list every downloaded asset and every
          # hash must match the uploaded bytes.
          ( cd "$DRAFT_DIR" && shasum -a 256 -c --strict "SpeechCast-${VERSION}.sha256sums" )
          ./Scripts/verify-release.sh dmg "$DRAFT_DIR/SpeechCast-${VERSION}.dmg" \
              --version "$VERSION"
          # The installer path, against the uploaded draft bytes directly:
          SPEECHCAST_DMG="$DRAFT_DIR/SpeechCast-${VERSION}.dmg" \
              SPEECHCAST_INSTALL_DIR="$RUNNER_TEMP/draft-install" \
              ./Scripts/install.sh
          ./Scripts/verify-release.sh app "$RUNNER_TEMP/draft-install/SpeechCast.app" \
              --version "$VERSION"

  publish:
    runs-on: macos-26
    needs: [build, verify-draft]
    if: needs.verify-draft.result == 'success'
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.full_version }}
    steps:
      - name: Publish the verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "v${VERSION}" --repo "$REPO" --draft=false
          echo "✓ Published SpeechCast ${VERSION}"

  # Remove only a draft created by this run. Leave its tag and any published release intact.
  cleanup-failed-release:
    runs-on: macos-26
    needs: [build, verify-draft]
    if: always() && needs.verify-draft.result == 'failure' && needs.verify-draft.outputs.draft_created == 'true'
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.full_version }}
    steps:
      - name: Delete the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "v${VERSION}" --repo "$REPO" --json isDraft --jq .isDraft)" = true ]; then
            gh release delete "v${VERSION}" --repo "$REPO" --yes
          fi
